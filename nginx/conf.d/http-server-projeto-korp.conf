# =============================================================================
# Nginx Reverse Proxy — http-server-projeto-korp.conf
# =============================================================================
#
# CONCEITO: Este arquivo diz ao Nginx COMO encaminhar pedidos.
# Nginx é a "recepcionista" — recebe pedidos na porta 80 e redireciona
# para o serviço Go na porta 8080 (que NÃO é acessível de fora).
#
# Fluxo: Cliente → :80 (Nginx) → :8080 (Go app, rede interna Docker)
# =============================================================================

# -------------------------------------------------------------------------
# UPSTREAM: Define o "destino" para onde o Nginx vai encaminhar
#
# CONCEITO: "upstream" é uma lista de servidores backend.
# Aqui temos apenas um, mas em produção poderíamos ter vários
# para balanceamento de carga (load balancing):
#   upstream go_backend {
#       server go-app-1:8080;
#       server go-app-2:8080;
#       server go-app-3:8080;
#   }
#
# "http-server-projeto-korp" é o NOME do serviço no docker-compose.yml.
# Docker resolve esse nome automaticamente para o IP do container (DNS interno).
# -------------------------------------------------------------------------

upstream go_backend {
    server http-server-projeto-korp:8080;
}

# -------------------------------------------------------------------------
# SERVER BLOCK: Configuração do servidor virtual
#
# CONCEITO: Um "server block" define como o Nginx se comporta para
# um determinado domínio/porta. É como uma "filial" do Nginx.
# Podemos ter múltiplos server blocks para diferentes sites.
# -------------------------------------------------------------------------

server {
    listen 80;          # Escuta na porta 80 (HTTP padrão)
    server_name _;      # Aceita QUALQUER domínio (wildcard)

    # =====================================================================
    # SECURITY HEADERS — Adição do material de segurança
    # =====================================================================
    #
    # CONCEITO: Headers HTTP são "cabeçalhos" que acompanham TODA resposta.
    # São instruções que o servidor manda para o navegador do cliente.
    # Estes headers de segurança são "gratuitos" — zero impacto em
    # performance, mas previnem classes inteiras de ataques.
    #
    # Referência: arquitetura_seguranca.md seção 5
    # =====================================================================

    # X-Frame-Options: DENY
    # → Impede que sua página seja colocada dentro de um <iframe> em outro site
    # → Previne ataque "Clickjacking" (o hacker sobrepõe um botão invisível
    #   sobre sua página, e o usuário clica sem saber)
    add_header X-Frame-Options "DENY" always;

    # X-Content-Type-Options: nosniff
    # → Impede o navegador de "adivinhar" o tipo do arquivo
    # → Sem isso, um arquivo .txt poderia ser interpretado como .js (código executável)
    # → Previne ataques de "MIME sniffing"
    add_header X-Content-Type-Options "nosniff" always;

    # X-XSS-Protection: 1; mode=block
    # → Ativa o filtro de XSS embutido no navegador
    # → XSS = Cross-Site Scripting (injetar JavaScript malicioso na página)
    # → "mode=block" = se detectar XSS, bloqueia a página inteira
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer-Policy: strict-origin-when-cross-origin
    # → Controla quanta informação o navegador envia quando o usuário clica num link
    # → "strict-origin-when-cross-origin" = envia apenas o domínio (não a URL completa)
    #   quando navegando para outro site
    # → Previne vazamento de URLs sensíveis (ex: /admin/usuarios/123)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy
    # → Define de onde o navegador pode carregar recursos (scripts, imagens, etc.)
    # → "default-src 'self'" = só carrega recursos do próprio domínio
    # → Previne XSS e injeção de conteúdo externo
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

    # =====================================================================
    # LOCATION BLOCKS: Roteamento de URLs
    # =====================================================================

    # Encaminha /projeto-korp para o backend Go
    location /projeto-korp {
        proxy_pass http://go_backend;

        # Headers que informam ao backend QUEM é o cliente real
        # (sem isso, o Go app veria o Nginx como "o cliente")
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Encaminha /health para o backend Go (usado por Docker healthcheck)
    location /health {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;

        # Desliga logs de acesso para /health (senão enche de lixo)
        # CONCEITO: O Docker vai bater no /health a cada 10 segundos.
        # São ~8.640 requests/dia SÓ de health check. Não queremos isso nos logs.
        access_log off;
    }

    # Encaminha /metrics para o backend Go (Prometheus vai scraping aqui)
    # Preparando para a Fase 3 (Monitoramento)
    location /metrics {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;
        access_log off;
    }
}
