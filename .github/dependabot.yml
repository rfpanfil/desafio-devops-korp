# =============================================================================
# Dependabot — Atualização automática de dependências
# =============================================================================
#
# CONCEITO: Dependabot verifica semanalmente se suas dependências
# têm atualizações de segurança e abre PRs automaticamente.
#
# Adaptado do material de segurança (dependabot.yml original).
# =============================================================================

version: 2
updates:
  # Manter GitHub Actions atualizadas
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps/actions):"

  # Manter módulos Go atualizados
  - package-ecosystem: "gomod"
    directory: "/go-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps/go):"

  # Manter imagens Docker atualizadas
  - package-ecosystem: "docker"
    directory: "/go-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps/docker):"
