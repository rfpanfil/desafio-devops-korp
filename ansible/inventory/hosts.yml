# =============================================================================
# Ansible Inventory — Lista de máquinas alvo
# =============================================================================
#
# CONCEITO: O inventory diz ao Ansible "em quais máquinas você vai executar?"
#
# No nosso caso, executamos no PRÓPRIO computador (localhost).
# Em produção, aqui teriam IPs de servidores reais:
#   webservers:
#     hosts:
#       server1: { ansible_host: 192.168.1.10 }
#       server2: { ansible_host: 192.168.1.11 }
#
# "ansible_connection: local" = executa direto, sem SSH.
# Isso é ideal para o desafio porque estamos no mesmo ambiente.
# =============================================================================

all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3
