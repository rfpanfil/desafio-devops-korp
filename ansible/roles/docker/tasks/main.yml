# =============================================================================
# Role: Docker — Verificação e configuração do Docker
# =============================================================================
#
# CONCEITO: Este role VERIFICA se o Docker está disponível.
# No nosso caso, Docker Desktop (Windows) já fornece Docker ao WSL2.
# Se não estiver disponível, instala via apt.
# =============================================================================

---
# -------------------------------------------------------------------------
# 1. Verificar se Docker já está instalado
# -------------------------------------------------------------------------

- name: Verificar se Docker está disponível
  command: docker --version
  register: docker_check
  ignore_errors: yes
  changed_when: false

- name: Exibir versão do Docker encontrada
  debug:
    msg: "Docker já disponível: {{ docker_check.stdout }}"
  when: docker_check.rc == 0

# -------------------------------------------------------------------------
# 2. Instalar Docker apenas se NÃO estiver disponível
# -------------------------------------------------------------------------
#
# CONCEITO: O bloco "when: docker_check.rc != 0" faz com que estas
# tasks SÓ executem se o Docker NÃO foi encontrado.
# Isso torna o playbook flexível: funciona tanto numa máquina limpa
# quanto numa que já tem Docker (como nosso WSL2).
# -------------------------------------------------------------------------

- name: Instalar dependências para Docker
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes
  become: yes
  when: docker_check.rc != 0

- name: Adicionar chave GPG oficial do Docker
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  become: yes
  when: docker_check.rc != 0

- name: Adicionar repositório Docker
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  become: yes
  when: docker_check.rc != 0

- name: Instalar Docker Engine e Compose
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes
  become: yes
  when: docker_check.rc != 0

- name: Garantir que Docker está rodando
  service:
    name: docker
    state: started
    enabled: yes
  become: yes
  when: docker_check.rc != 0

# -------------------------------------------------------------------------
# 3. Verificação final (sempre executa)
# -------------------------------------------------------------------------

- name: Confirmar Docker funcional
  command: docker info --format "{{ '{{' }}.ServerVersion{{ '}}' }}"
  register: docker_version_final
  changed_when: false

- name: Exibir versão final do Docker
  debug:
    msg: "Docker Server Version: {{ docker_version_final.stdout }}"
